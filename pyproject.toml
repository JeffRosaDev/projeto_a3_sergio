[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfood-priority-queue-a3"
version = "1.0.0"
description = "KitchenFlow — laboratório de filas de uma cozinha de fast food"
requires-python = ">=3.11"
dependencies = ["streamlit==1.67.0"]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = ["tmp", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
